name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck and PyYAML
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck python3-yaml
      - name: Hardware-free tests (cabling logic, recipe generator, cluster.env loading, bench guard, shellcheck)
        run: bash tests/run.sh
